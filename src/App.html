<v-app>
  <v-app-bar :elevation="4" color="appbar" scroll-behavior="hide" class="opacity-90">
    <v-app-bar-title>
      <div class="font-weight-bold text-center">LevainLab</div>
    </v-app-bar-title>
    <template #append>
      <v-btn
        :icon="isDark ? 'mdi-weather-sunny' : 'mdi-weather-night'"
        color="on-appbar"
        variant="text"
        @click="toggleTheme"
      />
    </template>
  </v-app-bar>

  <v-main>
    <DoughCalculator />
  </v-main>
</v-app>
