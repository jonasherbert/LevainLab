<v-container class="calculator">
  <div v-show="tab === 'inputs'" data-testid="view-inputs">
    <RecipeBaseCard />
    <StarterCard />
    <FermentationCard />
    <VorteigCard />
    <SoakerCard />
    <AdvancedCard />
    <v-btn
      block
      color="primary"
      size="large"
      append-icon="mdi-arrow-right"
      class="mb-4"
      data-testid="to-recipe"
      @click="$emit('update:tab', 'recipe')"
    >
      Zum Rezept
    </v-btn>
  </div>

  <div v-show="tab === 'recipe'" data-testid="view-recipe">
    <WarningList />
    <RecipeSummary />
    <RecipeSteps />
  </div>
</v-container>
