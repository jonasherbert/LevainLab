<v-card class="mb-4" color="surface" variant="elevated">
  <v-card-title class="text-primary">Vorteige</v-card-title>
  <v-card-subtitle class="text-primary"
    >Poolish, Biga und andere hefebasierte Vorteige</v-card-subtitle
  >
  <v-card-text>
    <v-card
      v-for="v in store.vorteige"
      :key="v.id"
      class="mb-3"
      color="background"
      variant="flat"
    >
      <v-card-text>
        <v-select
          :items="vorteigTypeItems"
          :model-value="v.type"
          @update:model-value="store.updateVorteigType(v.id, $event)"
          label="Typ"
          density="compact"
          variant="outlined"
          hide-details
          class="mb-3"
        />
        <v-row density="comfortable">
          <v-col cols="4">
            <v-text-field
              label="Mehl (%)"
              type="number"
              step="1"
              min="0"
              max="100"
              v-model.number="v.flourPercent"
              density="compact"
              variant="outlined"
            />
          </v-col>
          <v-col cols="4">
            <v-text-field
              label="Hydration (%)"
              type="number"
              step="1"
              min="0"
              v-model.number="v.hydration"
              density="compact"
              variant="outlined"
            />
          </v-col>
          <v-col cols="4">
            <v-text-field
              v-if="store.fermentation.mode === 'manual'"
              label="Frischhefe (%)"
              type="number"
              step="0.01"
              min="0"
              v-model.number="v.yeastPercent"
              density="compact"
              variant="outlined"
            />
            <v-text-field
              v-else
              label="Frischhefe (%)"
              :model-value="(result.vorteigResults.find(r => r.id === v.id)?.yeastPercent ?? 0).toFixed(3)"
              readonly
              density="compact"
              variant="outlined"
            />
          </v-col>
        </v-row>
        <v-row v-if="store.fermentation.mode === 'time'" density="comfortable" class="mt-n3">
          <v-col cols="6">
            <v-text-field
              label="Vorteig-Zeit (h)"
              type="number"
              step="0.5"
              min="0"
              v-model.number="v.fermentationHours"
              density="compact"
              variant="outlined"
            />
          </v-col>
          <v-col cols="6">
            <v-text-field
              label="Vorteig-Temperatur (°C)"
              type="number"
              step="1"
              v-model.number="v.fermentationTemp"
              density="compact"
              variant="outlined"
            />
          </v-col>
        </v-row>
        <div class="d-flex justify-end mt-n2">
          <v-btn size="small" variant="text" color="error" @click="store.removeVorteig(v.id)">
            Entfernen
          </v-btn>
        </div>
      </v-card-text>
    </v-card>
  </v-card-text>
  <v-card-actions>
    <v-btn color="primary" variant="tonal" @click="store.addVorteig()">+ Vorteig</v-btn>
  </v-card-actions>
</v-card>
