<v-card class="mb-4" color="surface" data-testid="card-base">
  <v-card-item>
    <template #prepend>
      <v-icon icon="mdi-scale-balance" color="primary" />
    </template>
    <v-card-title class="text-primary">Basis</v-card-title>
  </v-card-item>
  <v-card-text>
    <v-btn-toggle
      :model-value="store.sizingMode"
      mandatory
      divided
      density="compact"
      variant="outlined"
      color="primary"
      class="w-100 mb-4"
      @update:model-value="store.setSizingMode($event)"
    >
      <v-btn value="flour" class="flex-grow-1" data-testid="sizing-flour">Nach Mehl</v-btn>
      <v-btn value="pieces" class="flex-grow-1" data-testid="sizing-pieces">Nach Teiglingen</v-btn>
    </v-btn-toggle>

    <NumberField
      v-if="store.sizingMode === 'flour'"
      v-model="store.totalFlour"
      v-bind="fields.totalFlour"
      label="Gesamtmehl"
      suffix="g"
    />
    <v-row v-else density="comfortable" data-testid="pieces">
      <v-col cols="4">
        <NumberField v-model="store.pieceCount" v-bind="fields.pieceCount" label="Anzahl" />
      </v-col>
      <v-col cols="4">
        <NumberField
          v-model="store.pieceWeight"
          v-bind="fields.pieceWeight"
          label="Gewicht"
          suffix="g"
        />
      </v-col>
      <v-col cols="4">
        <NumberField
          v-model="store.lossPercent"
          v-bind="fields.lossPercent"
          label="Verlust"
          suffix="%"
        />
      </v-col>
      <v-col cols="12" class="mt-n3 pt-0 pb-3">
        <div class="text-body-medium text-medium-emphasis">{{ piecesText }}</div>
      </v-col>
    </v-row>

    <v-row density="comfortable">
      <v-col cols="6" sm="3">
        <NumberField
          v-model="store.targetHydration"
          v-bind="fields.targetHydration"
          label="Hydration"
          suffix="%"
        />
      </v-col>
      <v-col cols="6" sm="3">
        <NumberField
          v-model="store.saltPercent"
          v-bind="fields.saltPercent"
          label="Salz"
          suffix="%"
        />
      </v-col>
      <v-col cols="6" sm="3">
        <NumberField
          v-model="store.maltPercent"
          v-bind="fields.maltPercent"
          label="Malz"
          suffix="%"
        />
      </v-col>
      <v-col cols="6" sm="3">
        <NumberField
          v-model="store.fatPercent"
          v-bind="fields.fatPercent"
          label="Öl/Fett"
          suffix="%"
        />
      </v-col>
    </v-row>
  </v-card-text>
</v-card>
